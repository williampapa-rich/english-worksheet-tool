[project]
name = "qa-validator"
version = "0.1.0"
description = "LLM 출력의 정답 유일성 검증 — Phase 3 진입 시 활성화"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.0.0",
  "shared",
]

[tool.uv.sources]
shared = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qa_validator"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
