[project]
name = "extractor"
version = "0.1.0"
description = "PDF/이미지 → 정규화된 Passage+Question 추출 패키지"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.0.0",
  # workspace 멤버 패키지 — 의존성 주입 구조 (ADR-0003 §D-3.2)
  # shared: canonical schema (Passage, Question, Translation, Vocabulary, ExtractionResult)
  # llm: StructuredLLMClient 프로토콜 + PromptSpec (CLAUDE.md §8.3)
  "shared",
  "llm",
]

[tool.uv.sources]
shared = { workspace = true }
llm = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/extractor"]
