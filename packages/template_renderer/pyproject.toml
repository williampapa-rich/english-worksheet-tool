[project]
name = "template_renderer"
version = "0.1.0"
description = "Worksheet HTML 템플릿 렌더링 패키지 (Jinja2 + Playwright PDF)"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.0.0",
  # workspace 멤버 패키지
  "shared",
]

[tool.uv.sources]
shared = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/template_renderer"]
