services:
  # ── PostgreSQL 16 ────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-worksheet}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD 환경변수를 설정하세요}
      POSTGRES_DB: ${POSTGRES_DB:-worksheet_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-worksheet} -d ${POSTGRES_DB:-worksheet_db}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── FastAPI 서버 ──────────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-worksheet}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-worksheet_db}
      MVP_TENANT_ID: ${MVP_TENANT_ID:-00000000-0000-0000-0000-000000000001}
      DEBUG: ${DEBUG:-false}
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
