# Alembic 설정 파일
# apps/api/ 에서 실행: uv run alembic upgrade head

[alembic]
# 마이그레이션 스크립트 위치
script_location = alembic

# 마이그레이션 파일 네이밍 패턴: 타임스탬프_slug
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# DB URL은 env.py에서 환경변수로 주입 (여기 직접 적지 않음 — 시크릿 노출 방지)
sqlalchemy.url =

[post_write_hooks]
# ruff로 생성된 마이그레이션 파일 자동 포맷
hooks = ruff_format
ruff_format.type = exec
ruff_format.executable = uv
ruff_format.options = run ruff format %(output_file)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
