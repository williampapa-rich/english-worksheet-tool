[project]
name = "api"
version = "0.1.0"
description = "영어 학습 자료 생성 도구 — FastAPI 서버"
requires-python = ">=3.12"
dependencies = [
  # API 서버
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  # 환경변수 관리 — 대안: python-dotenv 단독 사용은 Pydantic 통합이 없어서 탈락
  "pydantic-settings>=2.7.0",
  # DB — SQLModel (Pydantic v2 + SQLAlchemy 2.x 통합) + asyncpg 드라이버
  # 대안: pydantic-sqlalchemy는 2023년 이후 유지보수 불활성으로 탈락.
  #       imperative mapping은 boilerplate 과다로 탈락.
  #       SQLModel은 tiangolo(FastAPI 저자) 개발 + 광범위한 커뮤니티. ADR-0005 PM-2 확정.
  "sqlmodel>=0.0.21",
  # SQLModel은 sqlalchemy[asyncio]를 의존성으로 포함하지만 명시적으로 기재
  "sqlalchemy[asyncio]>=2.0.0",
  "asyncpg>=0.30.0",
  # 마이그레이션 — Alembic은 SQLAlchemy 공식 마이그레이션 도구 (CLAUDE.md 3.6)
  "alembic>=1.14.0",
]

[dependency-groups]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.25.0",
  # httpx: FastAPI TestClient(ASGITransport) 용. requests 대신 httpx를 선택한 이유는
  # ASGITransport가 httpx에만 있어서 requests로는 async ASGI 앱을 인-프로세스로 테스트 불가
  "httpx>=0.28.0",
  # psycopg2-binary: Alembic 통합 테스트 전용 동기 드라이버. Alembic 의 command.upgrade /
  # downgrade 는 본질적으로 동기 (SQLAlchemy 1.x API) 라 asyncpg 는 사용 불가. 운영 코드는
  # asyncpg 만 사용. test_migrations.py 가 +asyncpg 를 떼고 psycopg2 로 fallback.
  "psycopg2-binary>=2.9.10",
]

[tool.uv]
# workspace 멤버로 등록된 패키지는 uv가 로컬 경로로 처리
package = true
